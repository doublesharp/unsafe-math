name: Validate library

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: doublesharp/foundry@e80dc641c6927578663b79fa4892d183febb3b11 # setup-forgeds-v1.0.1
        with:
          forgeds-version: 4ca15fcba25aa61a1b436d28b428e30b459f3d56
          forge-alias: 'true'
          cache-compilers: 'true'
          cache-prefix: unsafe-math
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Configure disposable outputs
        run: |
          echo "UNSAFE_MATH_BUILD_DIR=$RUNNER_TEMP/unsafe-math-build" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: node --test scripts/release.test.cjs
